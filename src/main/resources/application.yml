spring:
  application:
    name: sih-graphql-poc

  datasource:
    url: jdbc:postgresql://localhost:5432/sih
    username: sih
    password: sih

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # "demo" charge le jeu de données de démonstration (patients, séjours, documents).
    # En production on lancerait sans ce contexte.
    contexts: demo

  docker:
    compose:
      # Démarre docker-compose.yml au lancement de l'appli et le laisse tourner.
      # Mettre à false si tu as déjà un PostgreSQL local (base sih / sih / sih).
      enabled: true
      lifecycle-management: start-only

  graphql:
    path: /graphql
    graphiql:
      enabled: true          # http://localhost:8080/graphiql
    schema:
      locations: classpath:graphql/
      printer:
        enabled: true        # http://localhost:8080/graphql/schema
      inspection:
        enabled: true        # log au démarrage des champs du schéma non mappés
    websocket:
      path: /graphql-ws      # transport des subscriptions (protocole graphql-transport-ws)

sih:
  graphql:
    profondeur-max: 20       # protège contre les requêtes récursives abusives
    cout-max: 5000           # coût maximal d'une requête (directive @cout du schéma)

logging:
  level:
    # Affiche le SQL généré par Spring Data JDBC : idéal pour voir le N+1 et le batch loading
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.graphql: INFO
