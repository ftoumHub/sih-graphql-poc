# Filtre sur une période et un type de séjour
# Variables :
#   {
#     "filtre": {
#       "entreApres": "2026-11-01T00:00:00",
#       "entreAvant": "2026-12-01T00:00:00",
#       "type": "HOSPITALISATION_COMPLETE"
#     }
#   }
query SejoursPeriode($filtre: FiltreSejour!) {
  sejours(filtre: $filtre) {
    infoPage { totalElements }
    contenu {
      numeroSejour
      type
      dateEntree
      statut
    }
  }
}
