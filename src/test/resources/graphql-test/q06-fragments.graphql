# Fragments : factoriser une sélection de champs
query AvecFragments {
  premier: patient(id: 1) {
    ...IdentitePatient
  }
  second: patientParIpp(ipp: "00010004") {
    ...IdentitePatient
    estMineur
  }
}

fragment IdentitePatient on Patient {
  id
  ipp
  nomAffiche
  prenom
  dateNaissance
  age
  sexe
}
